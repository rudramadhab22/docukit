name: docukit
description: One application for all document-related operations.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  file_picker: ^13.4.0
  path_provider: ^2.1.6
  path: ^1.9.1
  pdfx: ^2.11.0
  pdf: ^3.12.0
  archive: ^4.0.9
  share_plus: ^13.3.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# pdf 3.12 caps archive <4.1.0 while image 4.11 needs archive decodeLazy APIs.
dependency_overrides:
  archive: 4.7.1

flutter:
  uses-material-design: true
